spring:
  application:
    name: bugpredict-ai
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bugpredictdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

bugpredict:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000
  storage:
    upload-dir: "./data/uploads"
    reports-dir: "./data/reports"
  thresholds:
    high-risk: 65.0
    critical-risk: 85.0
    cyclomatic-complexity: 15
    nesting-depth: 4
